<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis XV Años · Angely Lugo</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg:#2a0a17; --bg2:#4d1629; --ink:#f7e9e3; --blush:#f1cdc6; --blush2:#e4b3ab;
  --gold:#d6b26b; --gold2:#a9853f; --paper:#fbf4ef; --paper-ink:#4d1629;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#2a0a17; --bg2:#4d1629; --ink:#f7e9e3; --paper:#fbf4ef; --paper-ink:#4d1629; }
}
:root[data-theme="dark"]{ --bg:#2a0a17; --bg2:#4d1629; --ink:#f7e9e3; --paper:#fbf4ef; --paper-ink:#4d1629; }
*{box-sizing:border-box;margin:0}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  background:radial-gradient(120% 90% at 50% 0%,var(--bg2),var(--bg) 70%) var(--bg);
  color:var(--ink); font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  overflow:hidden;
}
.script{font-family:"Great Vibes","Snell Roundhand","Brush Script MT",cursive;font-weight:400}
.gold{color:var(--gold)}
/* partículas */
.spark{position:fixed;width:4px;height:4px;border-radius:50%;background:var(--gold);opacity:0;animation:float 9s linear infinite;pointer-events:none}
@keyframes float{0%{transform:translateY(20px);opacity:0}20%{opacity:.7}100%{transform:translateY(-120px);opacity:0}}
/* escena del sobre */
#stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px;transition:opacity .9s ease,visibility .9s}
#stage.hide{opacity:0;visibility:hidden}
.intro{text-align:center}
.intro .script{font-size:clamp(46px,14vw,72px);color:var(--blush);line-height:1}
.intro p{letter-spacing:.35em;text-transform:uppercase;font-size:13px;color:var(--gold);margin-top:8px}
.env{--w:min(86vw,380px);position:relative;width:var(--w);height:calc(var(--w)*.68);cursor:pointer;perspective:1200px;filter:drop-shadow(0 20px 30px rgba(0,0,0,.45));-webkit-tap-highlight-color:transparent}
.env .back{position:absolute;inset:0;background:linear-gradient(160deg,var(--blush),var(--blush2));border-radius:6px}
.letter{position:absolute;left:6%;right:6%;top:6%;height:88%;background:var(--paper);border-radius:4px;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--paper-ink);transition:transform .9s cubic-bezier(.4,0,.2,1) .6s;border:1px solid var(--gold)}
.letter .script{font-size:calc(var(--w)*.14);line-height:1}
.letter small{letter-spacing:.3em;font-size:11px;text-transform:uppercase;color:var(--gold2)}
.pocket{position:absolute;inset:0;z-index:2;pointer-events:none}
.pocket i{position:absolute;inset:0;border-radius:6px}
.pocket .l{background:linear-gradient(120deg,#f6d8d2,#e8bbb3);clip-path:polygon(0 0,52% 52%,0 100%)}
.pocket .r{background:linear-gradient(240deg,#f6d8d2,#e8bbb3);clip-path:polygon(100% 0,48% 52%,100% 100%)}
.pocket .b{background:linear-gradient(0deg,#efc6be,#e6b2aa);clip-path:polygon(0 100%,50% 48%,100% 100%)}
.flap{position:absolute;left:0;right:0;top:0;height:56%;z-index:3;transform-origin:top;transition:transform .8s ease,z-index 0s .4s;background:linear-gradient(180deg,#f8dcd6,#ecc2ba);clip-path:polygon(0 0,100% 0,50% 100%);backface-visibility:visible}
.seal{position:absolute;left:50%;top:56%;width:calc(var(--w)*.2);height:calc(var(--w)*.2);margin:calc(var(--w)*-.1) 0 0 calc(var(--w)*-.1);border-radius:50%;z-index:4;background:radial-gradient(circle at 35% 30%,#b3304f,#6d1230);box-shadow:0 4px 10px rgba(0,0,0,.4),inset 0 0 0 3px rgba(214,178,107,.55);display:flex;align-items:center;justify-content:center;color:var(--gold);font-weight:600;font-size:calc(var(--w)*.075);letter-spacing:.04em;transition:opacity .4s}
.env.open .flap{transform:rotateX(180deg);z-index:0}
.env.open .letter{transform:translateY(-48%)}
.env.open .seal{opacity:0}
.hint{letter-spacing:.3em;text-transform:uppercase;font-size:12px;color:var(--blush);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
/* invitación completa */
#invite{position:fixed;inset:0;overflow-y:auto;opacity:0;visibility:hidden;transition:opacity 1s ease .2s;-webkit-overflow-scrolling:touch}
#invite.show{opacity:1;visibility:visible}
.card{max-width:520px;margin:0 auto;padding:48px 24px 64px;text-align:center}
.frame{border:1px solid var(--gold);outline:1px solid rgba(214,178,107,.35);outline-offset:6px;padding:44px 24px;border-radius:2px;background:rgba(251,244,239,.04)}
.orn{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--gold);margin:18px 0}
.orn:before,.orn:after{content:"";height:1px;width:64px;background:linear-gradient(90deg,transparent,var(--gold))}
.orn:after{transform:scaleX(-1)}
.eyebrow{letter-spacing:.4em;text-transform:uppercase;font-size:13px;color:var(--gold)}
.xv{font-size:96px;line-height:1;color:var(--blush);font-weight:600}
.name{font-size:clamp(56px,17vw,84px);line-height:1.05;color:var(--ink)}
.lead{font-style:italic;font-size:21px;line-height:1.45;color:var(--blush);max-width:360px;margin:0 auto}
.grid{display:grid;gap:14px;margin-top:8px}
.item{border:1px solid rgba(214,178,107,.5);padding:18px 14px;border-radius:2px}
.item h3{letter-spacing:.35em;text-transform:uppercase;font-size:12px;color:var(--gold);font-weight:600;margin-bottom:6px}
.item p{font-size:23px;color:var(--ink);line-height:1.3}
.item small{display:block;font-size:16px;color:var(--blush);margin-top:4px;font-style:italic}
#count{display:none;gap:10px;justify-content:center;margin-top:6px}
#count div{min-width:64px;padding:10px 6px;border:1px solid rgba(214,178,107,.5)}
#count b{display:block;font-size:30px;color:var(--gold);font-weight:600}
#count span{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--blush)}
.btn{display:inline-block;margin-top:10px;padding:13px 26px;border:1px solid var(--gold);color:var(--bg);background:var(--gold);text-decoration:none;letter-spacing:.25em;text-transform:uppercase;font-size:13px;font-weight:600;border-radius:2px}
.btn.ghost{background:transparent;color:var(--gold)}
.foot{margin-top:26px;font-size:20px;font-style:italic;color:var(--blush)}
.rv{opacity:0;transform:translateY(16px);transition:opacity .8s ease,transform .8s ease}
#invite.show .rv{opacity:1;transform:none}
#invite.show .rv:nth-child(2){transition-delay:.4s}#invite.show .rv:nth-child(3){transition-delay:.7s}
#invite.show .rv:nth-child(4){transition-delay:1s}#invite.show .rv:nth-child(5){transition-delay:1.3s}
#invite.show .rv:nth-child(6){transition-delay:1.6s}#invite.show .rv:nth-child(7){transition-delay:1.9s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>

<div id="stage">
  <div class="intro">
    <div class="script">Angely</div>
    <p>Te invita a sus XV años</p>
  </div>
  <div class="env" id="env" role="button" tabindex="0" aria-label="Abrir invitación">
    <div class="back"></div>
    <div class="letter"><small>Mis</small><div class="script">XV Años</div><small>Angely Lugo</small></div>
    <div class="pocket"><i class="l"></i><i class="r"></i><i class="b"></i></div>
    <div class="flap"></div>
    <div class="seal">XV</div>
  </div>
  <div class="hint" id="hint">Toca el sobre para abrir</div>
</div>

<main id="invite">
  <div class="card">
    <div class="frame">
      <div class="rv"><div class="eyebrow">Con alegría te invito a celebrar</div>
        <div class="orn">✦</div>
        <div class="script xv">XV</div></div>
      <div class="rv"><div class="eyebrow">Mis años</div>
        <div class="script name">Angely Lugo</div>
        <div class="orn">✦</div></div>
      <div class="rv"><p class="lead" id="message"></p></div>
      <div class="rv grid" style="margin-top:28px">
        <div class="item"><h3>Fecha</h3><p id="fDate"></p></div>
        <div class="item"><h3>Hora</h3><p id="fTime"></p></div>
        <div class="item"><h3>Lugar</h3><p id="fPlace"></p><small id="fAddr"></small>
          <a class="btn ghost" id="map" href="#" target="_blank" rel="noopener" style="display:none;margin-top:14px">Ver ubicación</a></div>
      </div>
      <div class="rv"><div id="count"></div></div>
      <div class="rv"><a class="btn" id="rsvp" href="#" target="_blank" rel="noopener" style="display:none">Confirmar asistencia</a>
        <p class="foot">Tu presencia hará este día inolvidable.</p></div>
    </div>
  </div>
</main>

<script>
/* ====== EDITA AQUÍ LOS DATOS DE LA FIESTA ====== */
var CONFIG = {
  mensaje:   "Quiero compartir contigo uno de los días más especiales de mi vida.",
  fechaISO:  "2027-04-30T23:00:00",   // ejemplo: "2027-03-20T19:00:00"  (activa la cuenta regresiva)
  fechaTexto:"Viernes 30 de abril de 2027",   // ejemplo: "Sábado 20 de marzo de 2027"
  hora:      "11:00 p. m.",   // ejemplo: "7:00 p. m."
  lugar:     "Mi casa",   // ejemplo: "Salón Las Rosas"
  direccion: "El Salto, Durango",   // ejemplo: "Av. Principal 123, Ciudad"
  mapaUrl:   "https://www.google.com/maps/search/?api=1&query=QJFM%2B8X9%20El%20Salto%20Durango",   // enlace de Google Maps
  whatsapp:  "526751226625"    // solo números con lada, ejemplo: "5215512345678"
};
/* =============================================== */
(function(){
  var pend="Por confirmar";
  function $(i){return document.getElementById(i)}
  $("message").textContent="“"+CONFIG.mensaje+"”";
  $("fDate").textContent=CONFIG.fechaTexto||pend;
  $("fTime").textContent=CONFIG.hora||pend;
  $("fPlace").textContent=CONFIG.lugar||pend;
  $("fAddr").textContent=CONFIG.direccion;
  if(CONFIG.mapaUrl){var m=$("map");m.href=CONFIG.mapaUrl;m.style.display="inline-block"}
  if(CONFIG.whatsapp){var r=$("rsvp");
    r.href="https://wa.me/"+CONFIG.whatsapp+"?text="+encodeURIComponent("Hola, confirmo mi asistencia a los XV años de Angely.");
    r.style.display="inline-block"}
  if(CONFIG.fechaISO){
    var t=new Date(CONFIG.fechaISO).getTime(),box=$("count");
    if(!isNaN(t)){box.style.display="flex";
      (function tick(){var d=Math.max(0,t-Date.now()),s=Math.floor(d/1000);
        var v=[Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60],l=["Días","Horas","Min","Seg"];
        box.innerHTML=v.map(function(x,i){return "<div><b>"+x+"</b><span>"+l[i]+"</span></div>"}).join("");
        setTimeout(tick,1000)})()}
  }
  for(var i=0;i<22;i++){var s=document.createElement("span");s.className="spark";
    s.style.left=Math.random()*100+"vw";s.style.top=(40+Math.random()*60)+"vh";
    s.style.animationDelay=(Math.random()*9)+"s";s.style.animationDuration=(6+Math.random()*6)+"s";
    document.body.appendChild(s)}
  var env=$("env"),opened=false;
  function open(){
    if(opened)return;opened=true;env.classList.add("open");$("hint").style.visibility="hidden";
    setTimeout(function(){$("stage").classList.add("hide");$("invite").classList.add("show")},2100);
  }
  env.addEventListener("click",open);
  env.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();open()}});
})();
</script>
</body>
</html>
